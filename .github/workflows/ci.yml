name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.jpg'
      - '**.png'
      - '.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./entrega-Lab05/clinlab[dev]"

      - name: Run Ruff across full repository
        run: ruff check .

      - name: Run Pytest across full repository
        env:
          PYTHONPATH: ./entrega-Lab05/clinlab/src
        run: python -c "import pytest, sys; code = pytest.main(); sys.exit(0 if code in (0, 5) else code)"