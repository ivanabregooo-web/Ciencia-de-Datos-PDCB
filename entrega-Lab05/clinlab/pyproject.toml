[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinlab"
version = "0.1.0"
description = "Biomedical datasets processing and analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ivan Abrego", email = "ivanabregooo@gmail.com" }
]
dependencies = [
    "pandas>=3.0.0",
    "numpy>=2.2.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=clinlab --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]