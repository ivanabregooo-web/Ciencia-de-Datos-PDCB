include:
   - path: ./infra.yaml

services:
  web:
    build: .
    ports:
      - "${APP_PORT}:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: "${DB_PASSWORD:?ERROR: se debe ingresar contrasena desde archivo .env}"
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt
  jupyter:
    image: quay.io/jupyter/scipy-notebook:python-3.12
    ports:
      - "${JUPYTER_HOST_PORT}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    env_file:
      - .env
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    depends_on:
      db:
        condition: service_healthy